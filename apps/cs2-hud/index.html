<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { background: transparent; margin: 0; overflow: hidden; font: 600 14px "Segoe UI", sans-serif; color: #fff; }
    #hud { display: flex; gap: 14px; padding: 10px 14px; background: rgba(10, 12, 16, .72); border-radius: 10px; width: fit-content; }
    .s { display: flex; flex-direction: column; align-items: center; min-width: 40px; }
    .s b { font-size: 20px; }
    .s span { font-size: 10px; color: #9aa4b2; letter-spacing: .06em; }
    #hp.low { color: #ff5a5a; }
    #money { color: #7ee08a; }
    .hidden { display: none !important; }
    #wait { padding: 10px 14px; background: rgba(10,12,16,.72); border-radius: 10px; color: #9aa4b2; font-size: 12px; width: fit-content; }
  </style>
</head>
<body>
  <div id="wait">Waiting for CS2 data… (set up GSI in the launcher)</div>
  <div id="hud" class="hidden">
    <div class="s"><b id="hp">-</b><span>HP</span></div>
    <div class="s"><b id="armor">-</b><span>ARMOR</span></div>
    <div class="s"><b id="money">-</b><span>$</span></div>
    <div class="s"><b id="kills">-</b><span>KILLS</span></div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    let hidden = false;

    ez.cs2.onState((gs) => {
      const st = gs.player && gs.player.state;
      if (!st) return;
      $('wait').classList.add('hidden');
      $('hud').classList.toggle('hidden', hidden);
      $('hp').textContent = st.health;
      $('hp').classList.toggle('low', st.health <= 30);
      $('armor').textContent = st.armor;
      $('money').textContent = st.money;
      $('kills').textContent = st.round_kills;
    });

    ez.hotkeys.onPress((id) => {
      if (id !== 'toggle') return;
      hidden = !hidden;
      $('hud').classList.toggle('hidden', hidden);
    });
  </script>
</body>
</html>
