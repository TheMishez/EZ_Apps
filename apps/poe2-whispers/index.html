<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { background: transparent; margin: 0; overflow: hidden; font: 13px "Segoe UI", sans-serif; color: #eee; }
    #list { display: flex; flex-direction: column; gap: 6px; padding: 4px; }
    .w { background: rgba(20, 14, 8, .82); border-left: 3px solid #c8a060; border-radius: 6px; padding: 7px 10px; animation: in .2s; }
    .w b { color: #e8c27a; }
    .w .t { color: #9a8f80; font-size: 11px; float: right; }
    @keyframes in { from { opacity: 0; transform: translateX(10px); } }
  </style>
</head>
<body>
  <div id="list"></div>
  <script>
    // PoE2 log line:  ... [INFO Client 123] @From <Guild> Name: Hi, I would like to buy your ...
    const WHISPER = /@From (?:<[^>]*> )?([^:]+): (.*)$/;
    const list = document.getElementById('list');
    let seen = 0;

    function add(name, text) {
      const el = document.createElement('div');
      el.className = 'w';
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      el.innerHTML = '<span class="t"></span><b></b> ';
      el.querySelector('.t').textContent = time;
      el.querySelector('b').textContent = name;
      el.append(text);
      list.prepend(el);
      while (list.children.length > 4) list.lastChild.remove();
      setTimeout(() => el.remove(), 60000);
      ez.storage.set('whispersSeen', ++seen).catch(() => {});
    }

    ez.storage.get('whispersSeen').then((n) => (seen = n || 0)).catch(() => {});

    ez.poe2.onLog((lines) => {
      for (const line of lines) {
        const m = line.match(WHISPER);
        if (m && /buy|wtb|offer/i.test(m[2])) add(m[1], m[2]);
      }
    });
  </script>
</body>
</html>
